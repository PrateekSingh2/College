<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Banking Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen selection:bg-blue-200">

    <header class="bg-white border-b border-gray-200 px-6 py-4 mb-8">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-gray-900">Bank Management System</h1>
                <p class="text-gray-500 text-sm">Internal Core Portal</p>
            </div>
            <div id="statusIndicator" class="flex items-center space-x-2 text-sm font-medium text-green-700 bg-green-50 px-3 py-1 rounded-md border border-green-200">
                <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                <span>System Online</span>
            </div>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-6 pb-12">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="space-y-6 lg:col-span-1">
                
                <div class="bg-white border border-gray-200 rounded-lg p-5 shadow-sm">
                    <h2 class="text-lg font-semibold border-b border-gray-100 pb-3 mb-4">Open Account</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Account Holder Name</label>
                            <input type="text" id="newName" placeholder="Enter full name" 
                                class="w-full bg-white border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <button onclick="createAccount()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition-colors text-sm">
                            Create Account
                        </button>
                    </div>
                </div>

                <div class="bg-white border border-gray-200 rounded-lg p-5 shadow-sm">
                    <h2 class="text-lg font-semibold border-b border-gray-100 pb-3 mb-4">Transactions</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Source Account No.</label>
                            <input type="number" id="txAccNum" placeholder="e.g. 1001" 
                                class="w-full bg-white border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Amount (Rs.)</label>
                            <input type="number" id="txAmount" placeholder="0.00" 
                                class="w-full bg-white border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="flex space-x-3">
                            <button onclick="handleTransaction('deposit')" class="flex-1 bg-green-50 text-green-700 hover:bg-green-100 border border-green-200 font-medium py-2 rounded-md transition-colors text-sm">
                                Deposit
                            </button>
                            <button onclick="handleTransaction('withdraw')" class="flex-1 bg-white text-gray-700 hover:bg-gray-50 border border-gray-300 font-medium py-2 rounded-md transition-colors text-sm">
                                Withdraw
                            </button>
                        </div>
                        
                        <div class="border-t border-gray-200 my-4 pt-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Destination A/C (For Transfer)</label>
                            <input type="number" id="destAccNum" placeholder="e.g. 1002" 
                                class="w-full bg-white border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 mb-3">
                            <button onclick="handleTransaction('transfer')" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-medium py-2 px-4 rounded-md transition-colors text-sm">
                                Transfer Funds
                            </button>
                        </div>
                    </div>
                </div>

            </div>

            <div class="lg:col-span-2 space-y-6">
                
                <div class="bg-white border border-gray-200 rounded-lg p-5 shadow-sm flex items-end space-x-3">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Lookup Account</label>
                        <input type="number" id="searchAccNum" placeholder="Enter Account Number..." 
                            class="w-full bg-white border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <button onclick="fetchAccountDetails()" class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium py-2 px-6 rounded-md transition-colors text-sm shadow-sm">
                        Search
                    </button>
                </div>

                <div id="displayArea" class="bg-white border border-gray-200 rounded-lg p-8 min-h-[400px] flex flex-col justify-center items-center text-center shadow-sm">
                    <svg class="w-12 h-12 text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                    <p class="text-gray-500 text-sm">No account loaded. Search or create an account to view details.</p>
                </div>

            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-16 opacity-0 transition-all duration-200 bg-gray-900 text-white px-5 py-3 rounded shadow-lg flex items-center space-x-3 pointer-events-none z-50">
        <span id="toastIcon" class="text-sm"></span>
        <span id="toastMsg" class="text-sm font-medium"></span>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            toastMsg.innerText = message;
            toastIcon.innerHTML = type === 'success' ? '✓' : '✕';
            
            toast.className = `fixed bottom-6 right-6 transform opacity-100 translate-y-0 transition-all duration-200 px-5 py-3 rounded shadow-lg flex items-center space-x-3 pointer-events-none z-50 ${type === 'success' ? 'bg-gray-900 text-white' : 'bg-red-600 text-white'}`;
            
            setTimeout(() => {
                toast.classList.add('translate-y-16', 'opacity-0');
            }, 3000);
        }

        async function createAccount() {
            const name = document.getElementById('newName').value;
            if (!name) return showToast('Please enter a name', 'error');

            try {
                const res = await fetch(`${API_BASE}/account`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                const data = await res.json();
                
                if (res.ok) {
                    showToast(`Account created! A/C No: ${data.accountNumber}`);
                    document.getElementById('newName').value = '';
                    document.getElementById('searchAccNum').value = data.accountNumber;
                    document.getElementById('txAccNum').value = data.accountNumber;
                    fetchAccountDetails();
                }
            } catch (err) {
                showToast('Failed to connect', 'error');
            }
        }

        async function fetchAccountDetails() {
            const accNum = document.getElementById('searchAccNum').value;
            if (!accNum) return;

            const display = document.getElementById('displayArea');
            display.innerHTML = `<p class="text-gray-500 text-sm">Loading data...</p>`;

            try {
                const [detailsRes, statementRes] = await Promise.all([
                    fetch(`${API_BASE}/account/${accNum}`),
                    fetch(`${API_BASE}/account/${accNum}/statement`)
                ]);

                if (!detailsRes.ok) {
                    display.innerHTML = `<p class="text-red-600 text-sm font-medium">Account ${accNum} not found.</p>`;
                    return;
                }

                const data = await detailsRes.json();
                const statementData = await statementRes.json();
                
                let statementHTML = '';
                if (statementData.transactions && statementData.transactions.length > 0) {
                    statementHTML = statementData.transactions.map(tx => {
                        const isDeposit = tx.type.toLowerCase().includes('deposit') || tx.type.toLowerCase().includes('received');
                        return `
                            <tr class="border-b border-gray-100 hover:bg-gray-50">
                                <td class="px-4 py-3 text-sm text-gray-700">${tx.type}</td>
                                <td class="px-4 py-3 text-sm text-right ${isDeposit ? 'text-green-700' : 'text-gray-900'}">
                                    ${isDeposit ? '+' : '-'} ${tx.amount.toFixed(2)}
                                </td>
                                <td class="px-4 py-3 text-sm text-right text-gray-500">${tx.balanceAfter.toFixed(2)}</td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    statementHTML = `<tr><td colspan="3" class="px-4 py-6 text-center text-gray-500 text-sm">No transactions found.</td></tr>`;
                }

                display.innerHTML = `
                    <div class="w-full text-left h-full flex flex-col">
                        
                        <div class="flex justify-between items-start mb-6 border-b border-gray-200 pb-6">
                            <div>
                                <h3 class="text-2xl font-bold text-gray-900">${data.name}</h3>
                                <p class="text-sm text-gray-500 mt-1">Account No: <span class="font-medium text-gray-900">${data.accountNumber}</span></p>
                            </div>
                            <div class="text-right">
                                <p class="text-xs font-medium text-gray-500 uppercase tracking-wide">Available Balance</p>
                                <p class="text-2xl font-bold text-blue-600 mt-1">Rs. ${data.balance.toFixed(2)}</p>
                            </div>
                        </div>

                        <div class="flex-1">
                            <h4 class="text-sm font-semibold text-gray-900 mb-3 uppercase tracking-wide">Mini Statement</h4>
                            <div class="border border-gray-200 rounded-md overflow-hidden">
                                <table class="w-full text-left">
                                    <thead class="bg-gray-50 border-b border-gray-200">
                                        <tr>
                                            <th class="px-4 py-2 text-xs font-semibold text-gray-600 uppercase">Transaction Type</th>
                                            <th class="px-4 py-2 text-xs font-semibold text-gray-600 uppercase text-right">Amount (Rs.)</th>
                                            <th class="px-4 py-2 text-xs font-semibold text-gray-600 uppercase text-right">Balance After</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${statementHTML}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                showToast('Failed to fetch details', 'error');
                display.innerHTML = `<p class="text-red-600 text-sm font-medium">Connection error. Could not retrieve account details.</p>`;
            }
        }

        async function handleTransaction(type) {
            const accNum = document.getElementById('txAccNum').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            const bodyData = { amount };

            if (!accNum || !amount || amount <= 0) return showToast('Invalid details', 'error');

            if (type === 'transfer') {
                const destNum = document.getElementById('destAccNum').value;
                if (!destNum) return showToast('Enter destination account', 'error');
                bodyData.destination = parseInt(destNum);
            }

            try {
                const res = await fetch(`${API_BASE}/account/${accNum}/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                if (res.ok) {
                    showToast(`${type.charAt(0).toUpperCase() + type.slice(1)} successful!`);
                    document.getElementById('txAmount').value = '';
                    if (type === 'transfer') document.getElementById('destAccNum').value = '';
                    
                    if (document.getElementById('searchAccNum').value === accNum) {
                        fetchAccountDetails();
                    }
                } else {
                    showToast(`${type} failed. Check balance or target A/C.`, 'error');
                }
            } catch (err) {
                showToast('Connection error', 'error');
            }
        }
    </script>
</body>
</html>
